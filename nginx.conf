server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # cloudflared đứng trước nginx -> lấy IP thật của khách từ header Cloudflare
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Nén
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/pdf
        image/svg+xml;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check cho Docker / cloudflared
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Asset đã có hash trong tên file -> cache dài hạn
    # ^~ để rule này thắng regex location bên dưới
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Không cache index.html để deploy mới ăn ngay
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # File tĩnh không tồn tại thì trả 404, không rơi vào SPA fallback
    # (tránh trường hợp nginx trả index.html cho request .css/.js)
    location ~* \.(?:css|js|mjs|json|map|png|jpe?g|gif|svg|webp|avif|ico|pdf|woff2?|ttf|eot|txt|xml)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
